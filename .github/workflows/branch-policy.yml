name: Branch policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, dev, qa]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        uses: actions/github-script@v7
        with:
          script: |
            const base = context.payload.pull_request.base.ref;
            const head = context.payload.pull_request.head.ref;

            const rules = {
              main: [/^qa$/, /^hotfix\//],
              qa: [/^dev$/, /^hotfix\//, /^main$/],
              dev: [
                /^(feat|fix|db|chore|docs|refactor|test)\//,
                /^hotfix\//,
                /^main$/,
              ],
            };

            const allowed = rules[base];

            if (!allowed) {
              core.info(`No branch policy for base "${base}".`);
              return;
            }

            if (!allowed.some((pattern) => pattern.test(head))) {
              core.setFailed(
                `PR from "${head}" to "${base}" is not allowed. ` +
                  `See docs/engineering/git-workflow.md.`
              );
            } else {
              core.info(`PR "${head}" -> "${base}" is allowed.`);
            }
